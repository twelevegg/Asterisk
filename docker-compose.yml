services:
  asterisk:
    image: andrius/asterisk:20
    container_name: asterisk
    restart: unless-stopped

    # SIP(5060) + RTP(10000-10100) 오픈
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-10100:10000-10100/udp"

